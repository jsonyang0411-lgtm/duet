# Example: the site behind Caddy (automatic HTTPS). Copy to docker-compose.yml,
# put your domain into Caddyfile, your settings into site.env (chmod 600) and
# the admin token into admin_token.txt (owner 10001, chmod 400; DEPLOY.md, section 5),
# then: docker compose up -d --build
services:
  site:
    build: .
    restart: unless-stopped
    env_file: site.env          # SAMPLE_SITE_PUBLIC_URL=https://...
    environment:
      SAMPLE_SITE_TRUST_PROXY: "1"
      SAMPLE_SITE_ADMIN_TOKEN_FILE: /run/secrets/admin_token
    secrets:
      - admin_token
    volumes:
      - site-data:/data
    expose:
      - "8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - site
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  admin_token:
    file: ./admin_token.txt

volumes:
  site-data:
  caddy-data:
  caddy-config:
